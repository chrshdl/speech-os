name: Dev image

# Build a flashable DEV image from any speech ref (branch, tag, or SHA)
# without touching the release chain: no release asset, no pin bump, no
# commit anywhere. The speech tarball is built right here with `git archive`
# and pre-seeded into Buildroot's download directory under the name its git
# download would have, so the sha256 pin is satisfied locally and the
# package's .mk/.hash on this branch are only patched in the runner's
# workspace.
#
# Dev images keep the defconfig as-is (SSH + root login, no release
# hardening) and upload as workflow artifacts, never as release assets.
# For an image of the *pinned* speech version, dispatch ci.yml instead.
#
#   gh workflow run dev-image.yml -f speech_ref=<branch|sha> [-f board=raspberrypi4-64]

on:
  workflow_dispatch:
    inputs:
      speech_ref:
        description: "speech branch, tag, or SHA to bake into the image"
        required: true
        default: "master"
      board:
        description: "board to build"
        type: choice
        options: [raspberrypi5, raspberrypi4-64, all]
        default: raspberrypi5

permissions:
  contents: read

jobs:
  boards:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - id: pick
        run: |
          if [ "${{ inputs.board }}" = "all" ]; then
            echo 'list=["raspberrypi5","raspberrypi4-64"]' >> "$GITHUB_OUTPUT"
          else
            echo 'list=["${{ inputs.board }}"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: boards
    runs-on: ubuntu-latest
    # WebKit alone takes hours on a hosted runner; stay within the 6h cap.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.boards.outputs.list) }}
    env:
      # Both cached between runs, shared with ci.yml, see "Restore
      # compiler cache" there.
      BR2_DL_DIR: ${{ github.workspace }}/dl
      BR2_CCACHE_DIR: ${{ github.workspace }}/ccache
    steps:
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1 # v3.2.2
        with:
          remove_android: true
          remove_tool_cache: true

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 unzip rsync bc libncurses5-dev \
            bison flex cpio wget libssl-dev libgnutls28-dev

      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned Buildroot version
        id: buildroot
        run: echo "version=$(cat BUILDROOT_VERSION)" >> "$GITHUB_OUTPUT"

      # Keyed like ci.yml's, so before the speech pin is patched below.
      - name: Restore download cache
        id: dl-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dl
            !dl/python-speech
          key: dl-${{ steps.buildroot.outputs.version }}-${{ hashFiles('configs/**', 'package/**') }}
          restore-keys: dl-${{ steps.buildroot.outputs.version }}-

      - name: Restore compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ccache
          key: ccache-${{ matrix.board }}-${{ steps.buildroot.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ matrix.board }}-${{ steps.buildroot.outputs.version }}-
            ccache-${{ matrix.board }}-

      - name: Checkout speech at ${{ inputs.speech_ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chrshdl/speech
          ref: ${{ inputs.speech_ref }}
          path: speech

      # The tree Buildroot's git download would archive, under the name and
      # top directory it would use, consumed locally: pre-seeding
      # BR2_DL_DIR means Buildroot verifies the hash and never goes to the
      # network, so the (workspace-only) .mk/.hash patch below can point at
      # a version that exists nowhere else.
      - name: Seed the speech tarball and patch the pin (workspace only)
        id: speech
        run: |
          SPEECH_SHA=$(git -C speech rev-parse --short=9 HEAD)
          VERSION="dev-g${SPEECH_SHA}"
          TARBALL="python-speech-${VERSION}-git4.tar.gz"

          git -C speech archive --format=tar.gz \
            --prefix="python-speech-${VERSION}/" \
            -o "${GITHUB_WORKSPACE}/${TARBALL}" HEAD
          SHA256=$(sha256sum "${TARBALL}" | awk '{print $1}')

          mkdir -p dl/python-speech
          mv "${TARBALL}" dl/python-speech/

          MK="package/python-speech/python-speech.mk"
          HASH="package/python-speech/python-speech.hash"
          sed -i "s/^PYTHON_SPEECH_VERSION = .*/PYTHON_SPEECH_VERSION = ${VERSION}/" "$MK"
          sed -i "s|^sha256  [0-9a-f]*  python-speech-.*-git4\.tar\.gz$|sha256  ${SHA256}  ${TARBALL}|" "$HASH"
          grep -q "${TARBALL}" "$HASH"

          echo "speech_sha=${SPEECH_SHA}" >> "$GITHUB_OUTPUT"
          echo "Baking speech $(git -C speech log --oneline -1)" >> "$GITHUB_STEP_SUMMARY"

      # The models are not in git: models/sources pins each by URL and
      # sha256, see models/README.md.
      - name: Fetch models
        run: |
          while read -r sha url path; do
            case "$sha" in ''|'#'*) continue ;; esac
            f="models/${path:-$(basename "$url")}"
            mkdir -p "$(dirname "$f")"
            curl -fsSL --retry 3 -o "$f" "$url"
            echo "$sha  $f" | sha256sum -c -
          done < models/sources

      - name: Checkout Buildroot ${{ steps.buildroot.outputs.version }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "buildroot/buildroot"
          ref: "${{ steps.buildroot.outputs.version }}"
          path: buildroot

      # Always the dev variant: defconfig as-is (SSH + root/root login),
      # no release fragment, no SPEECH_OS_VERSION. Plus ccache, as in
      # ci.yml.
      - name: Configure for ${{ matrix.board }}
        run: |
          make -C buildroot BR2_EXTERNAL=../ O=../output ${{ matrix.board }}_defconfig
          cat >> output/.config <<'EOF'
          BR2_CCACHE=y
          BR2_CCACHE_INITIAL_SETUP="--max-size=5G"
          EOF
          make -C buildroot O=../output olddefconfig
          grep -q '^BR2_CCACHE=y$' output/.config
          make -C buildroot O=../output ccache-options CCACHE_OPTIONS=--zero-stats

      - name: Download sources
        id: source
        run: make -C buildroot O=../output source

      - name: Save download cache
        if: always() && steps.source.outcome == 'success' && steps.dl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dl
            !dl/python-speech
          key: ${{ steps.dl-cache.outputs.cache-primary-key }}

      - name: Build for ${{ matrix.board }}
        id: build
        # Leaves the job time to save the ccache when the build runs out.
        timeout-minutes: 300
        run: make -C buildroot O=../output

      - name: Show compiler cache stats
        if: always() && steps.build.outcome != 'skipped'
        run: |
          {
            echo '### ccache'
            echo '```'
            make -s -C buildroot O=../output ccache-stats
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save compiler cache
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ccache
          key: ccache-${{ matrix.board }}-${{ steps.buildroot.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Name image
        run: |
          REF_SAFE="${{ inputs.speech_ref }}"
          REF_SAFE="${REF_SAFE//\//-}"
          IMG="dev-speech-${REF_SAFE}-g${{ steps.speech.outputs.speech_sha }}-${{ matrix.board }}.img"
          mv "output/images/sdcard.img" "output/images/${IMG}"
          echo "IMG=${IMG}" >> "$GITHUB_ENV"

      - name: Upload dev image as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.IMG }}
          path: output/images/${{ env.IMG }}
          retention-days: 14
          # sdcard.img is mostly sparse free space: max out the zip this
          # action builds internally rather than leaving it at the default.
          compression-level: 9
