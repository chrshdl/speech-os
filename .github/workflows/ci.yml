name: CI speech-os

# Dev images only. A release is built on a build host, see README.md: a
# cold build runs past a hosted runner's 6h cap.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The image build (~3-4h with WPE WebKit) is expensive, so it does NOT run
    # on pull requests by default. Add the "build" label to a PR to opt into an
    # image build for it. workflow_dispatch always builds.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'build')
    # WebKit alone takes hours on a hosted runner; stay within the 6h cap.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # configs/raspberrypi4-64_defconfig builds locally, or with
        # dev-image.yml's board input.
        board: [raspberrypi5]
    env:
      # Both cached between runs, see "Restore compiler cache".
      BR2_DL_DIR: ${{ github.workspace }}/dl
      BR2_CCACHE_DIR: ${{ github.workspace }}/ccache
    steps:
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@8b8cd4e2277836962939a8f3b4ea0ee4bc006156 # v4.0.1
        with:
          remove_android: true
          remove_tool_cache: true

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 unzip rsync bc libncurses5-dev \
            bison flex cpio wget libssl-dev libgnutls28-dev

      - name: Checkout this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The models are not in git: models/sources pins each by URL and
      # sha256, the acoustic model, the LM and the wake word as assets of
      # this repository's models-* release, see models/README.md.
      - name: Fetch models
        run: |
          while read -r sha url path; do
            case "$sha" in ''|'#'*) continue ;; esac
            f="models/${path:-$(basename "$url")}"
            mkdir -p "$(dirname "$f")"
            curl -fsSL --retry 3 -o "$f" "$url"
            echo "$sha  $f" | sha256sum -c -
          done < models/sources

      # Single source of truth for the Buildroot pin; bumped by the
      # triage-buildroot workflow (or by hand) via a one-line PR.
      - name: Read pinned Buildroot version
        id: buildroot
        run: echo "version=$(cat BUILDROOT_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Checkout Buildroot ${{ steps.buildroot.outputs.version }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "buildroot/buildroot"
          ref: "${{ steps.buildroot.outputs.version }}"
          path: buildroot

      # A cold build runs past the 6h cap of a hosted runner, so CI caches
      # the sources (dl/) and Buildroot's ccache. The build step has its own
      # timeout, so a run that runs out of time still saves its ccache and
      # the next one picks up about where it stopped. ccache keys the
      # compiler by Buildroot's toolchain hash, so it survives the toolchain
      # being rebuilt from scratch every run. Caches saved on main reach
      # every branch and PR.
      - name: Restore download cache
        id: dl-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Without speech: dev-image.yml puts a tarball of its own there.
          # The paths are part of the cache's version, so they must match
          # in every restore and save, in both workflows.
          path: |
            dl
            !dl/python-speech
          key: dl-${{ steps.buildroot.outputs.version }}-${{ hashFiles('configs/**', 'package/**') }}
          restore-keys: dl-${{ steps.buildroot.outputs.version }}-

      - name: Restore compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ccache
          key: ccache-${{ matrix.board }}-${{ steps.buildroot.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ matrix.board }}-${{ steps.buildroot.outputs.version }}-
            ccache-${{ matrix.board }}-

      - name: Configure for ${{ matrix.board }}
        run: |
          make -C buildroot BR2_EXTERNAL=../ O=../output ${{ matrix.board }}_defconfig

          # CI only, the defconfigs leave ccache off for local builds. 5G
          # is ccache's default, spelled out as the budget it takes of the
          # repository's 10 GB of Actions cache.
          cat >> output/.config <<'EOF'
          BR2_CCACHE=y
          BR2_CCACHE_INITIAL_SETUP="--max-size=5G"
          EOF
          make -C buildroot O=../output olddefconfig
          grep -q '^BR2_CCACHE=y$' output/.config

          # Builds host-ccache, so the stats below count this run only.
          make -C buildroot O=../output ccache-options CCACHE_OPTIONS=--zero-stats

      # Separate from the build, so dl/ is saved only once it is complete.
      - name: Download sources
        id: source
        run: make -C buildroot O=../output source

      - name: Save download cache
        if: always() && steps.source.outcome == 'success' && steps.dl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dl
            !dl/python-speech
          key: ${{ steps.dl-cache.outputs.cache-primary-key }}

      - name: Build for ${{ matrix.board }}
        id: build
        # Leaves the job time to save the ccache when the build runs out.
        # timeout(1) stops the whole build first: at the step's own timeout
        # GitHub left compilers running, which kept writing to the ccache
        # while it was saved (tar: "file changed as we read it"), and the
        # save failed.
        timeout-minutes: 300
        run: timeout --kill-after=1m 290m make -C buildroot O=../output

      - name: Show compiler cache stats
        if: always() && steps.build.outcome != 'skipped'
        run: |
          {
            echo '### ccache'
            echo '```'
            make -s -C buildroot O=../output ccache-stats
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save compiler cache
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ccache
          key: ccache-${{ matrix.board }}-${{ steps.buildroot.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Name image
        run: |
          IMG="dev-${GITHUB_REF_NAME//\//-}-${{ matrix.board }}.img"
          mv "output/images/sdcard.img" "output/images/${IMG}"
          echo "IMG=${IMG}" >> "$GITHUB_ENV"

      - name: Upload dev image as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.IMG }}
          path: output/images/${{ env.IMG }}
          retention-days: 14
          compression-level: 9
