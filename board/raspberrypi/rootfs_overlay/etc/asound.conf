# The default ALSA device is the USB audio device (a USB speakerphone or
# microphone), which /etc/udev/rules.d/85-usb-audio.rules names "usbaudio"
# whatever its card number. speech-backend records from it, and the kiosk's
# browser plays the client's chimes, songs and keyboard on it.
#
# speech-backend records at the model's 16 kHz, which many devices do not
# offer. plug converts from a rate the device has, with libsamplerate
# (alsa-plugins) rather than ALSA's built-in linear interpolation, which has
# no low-pass filter and folds the high frequencies into the speech band.
defaults.pcm.rate_converter "samplerate_medium"

pcm.usbcapture {
    type plug
    slave.pcm "hw:usbaudio"
}

# The browser plays on the device itself, in a format and at a rate it has,
# to which GStreamer converts (Web Audio renders at 44.1 kHz). Its sink buffers
# only 8 ms, for the keyboard to sound at once (wpewebkit/0003): through plug,
# converting the rate, a USB speakerphone underran without end at many such
# small buffer sizes, while on the device's own rate it plays on.
#
# The rate is fixed at 48 kHz, which USB speakerphones play: GStreamer's
# alsasink reads only a device's lowest and highest rate, so it took a Jabra
# with 8, 16 and 48 kHz for one of any rate in between, and was given 44.1
# kHz unconverted, which ALSA then played at the nearest the device has,
# 48 kHz, without an error. Everything played 8.8% fast and 1.5 semitones
# sharp, and the radio, arriving in real time, ran dry every 15 seconds.
pcm.usbplayback {
    type hw
    card usbaudio
    rate 48000
}

pcm.!default {
    type asym
    capture.pcm "usbcapture"
    playback.pcm "usbplayback"
}

ctl.!default {
    type hw
    card usbaudio
}
