[system]
compatible=@BOARD_COMPATIBLE@
bootloader=uboot
data-directory=/data/rauc
mountprefix=/run/rauc

# No [keyring] yet: this image installs no update bundles. RAUC is here to
# mark the booted slot good (speech-health.service). Add the CA certificate
# that signs the bundles when an update pipeline exists.

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=B
