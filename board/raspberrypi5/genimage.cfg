# No start*.elf or fixup*.dat: the Pi 5 boots from the firmware in its
# EEPROM. bcm2712d0 is for the boards with the D0 stepping of the SoC; the
# firmware picks the device tree that matches the board.
image boot.vfat {
  vfat {
    files = {
      "bcm2712-rpi-5-b.dtb",
      "bcm2712d0-rpi-5-b.dtb",
      "rpi-firmware/cmdline.txt",
      "rpi-firmware/config.txt",
      "rpi-firmware/overlays",
      "u-boot.bin",
      "boot.scr"
    }
  }
  size = 64M
}

# The persistent partition, seeded by post-image.sh with the acoustic model,
# the LM and the backend's arguments (the rootpath's /data). Sized for the
# models plus room to swap in larger ones on the device, such as a 4-gram LM
# of a few hundred MB.
image data.ext4 {
  mountpoint = "/data"
  ext4 {
    label = "data"
  }
  size = 1G
}

image sdcard.img {
  hdimage {}

  # Redundant U-Boot environment in the raw gap before the first
  # partition (CONFIG_ENV_IS_IN_MMC + CONFIG_SYS_REDUNDAND_ENVIRONMENT;
  # /etc/fw_env.config mirrors these offsets). Both copies are seeded
  # with the same defaults; U-Boot alternates between them on saveenv
  # and falls back to the valid copy after an interrupted write.
  partition uboot-env-a {
    in-partition-table = "no"
    image = "uboot-env.bin"
    offset = 0x400000
  }

  partition uboot-env-b {
    in-partition-table = "no"
    image = "uboot-env.bin"
    offset = 0x404000
  }

  partition boot {
    partition-type = 0xC
    bootable = "true"
    # Explicit: keep the first real partition clear of the env copies.
    offset = 8M
    image = "boot.vfat"
  }

  partition rootfs_A {
    partition-type = 0x83
    image = "rootfs.ext4"
  }

  partition rootfs_B {
    partition-type = 0x83
    image = "rootfs.ext4"
  }

  partition data {
    partition-type = 0x83
    image = "data.ext4"
  }
}
